<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cashier POS | Jay Footwear</title><link rel="stylesheet" href="cashier.css"><script src="cashier.js" defer></script></head><body>
<div id="gate" class="gate">Checking cashier access…</div><div id="app" class="app hidden">
<header><a href="/" class="brand"><span>JAY</span> FOOTWEAR</a><div><p>CASHIER WORKSPACE</p><strong id="cashierName">Cashier</strong></div><button id="logout">Sign out</button></header>
<main><section class="sale-area"><div class="title"><div><p>PROCESS SALES TRANSACTION</p><h1>Point of sale</h1></div><input id="search" placeholder="Search product, brand, or SKU…"></div><div id="products" class="products"></div></section>
<aside class="cart"><div class="cart-head"><p>CURRENT SALE</p><h2>Order details</h2></div><div id="cartItems" class="cart-items"><div class="empty">Select a product to begin.</div></div><div class="fields"><label>Customer<select id="customer"></select></label><div class="field-row"><label>Discount<input id="discount" type="number" min="0" max="20" value="0"><span>%</span></label><label>Payment<select id="payment"></select></label></div></div><div class="totals"><div><span>Subtotal</span><b id="subtotal">₱0</b></div><div><span>Discount</span><b id="discountTotal">−₱0</b></div><div class="grand"><span>Total</span><b id="total">₱0</b></div></div><button class="checkout" id="checkout" disabled>Complete sale & issue receipt</button><p id="message"></p></aside>
<section class="recent"><div class="title"><div><p>TRANSACTION HISTORY</p><h2>Recent sales</h2></div></div><div id="recentTable"></div></section></main></div>
<div class="receipt-backdrop hidden" id="receiptModal"><div class="receipt" id="receipt"><button class="close" id="receiptClose">×</button><div class="receipt-brand">JAY FOOTWEAR</div><p>Official Sales Receipt</p><div id="receiptContent"></div><button class="print" id="printReceipt">Print receipt</button></div></div><div class="toast" id="toast"></div></body></html>
