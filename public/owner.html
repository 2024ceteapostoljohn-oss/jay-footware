<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Reports | Jay Footwear</title><link rel="stylesheet" href="owner.css"><script src="owner.js" defer></script></head><body><div id="gate">Checking owner access…</div><div id="app" class="hidden"><header><a href="/" class="brand"><span>JAY</span> FOOTWEAR</a><nav><button class="active" data-view="summary">Summary</button><button data-view="sales">Sales</button><button data-view="inventory">Inventory</button><button data-view="suppliers">Suppliers</button></nav><div><strong id="ownerName">Owner</strong><button id="logout">Sign out</button></div></header><main><div class="heading"><p>OWNER / MANAGER</p><h1>Business reports</h1><span>Read-only performance and operations overview</span></div><section id="summary" class="view active"><div class="stats"><article><span>Transactions</span><strong id="transactions">—</strong></article><article><span>Pairs sold</span><strong id="pairs">—</strong></article><article><span>Total revenue</span><strong id="revenue">—</strong></article><article class="alert"><span>Low-stock products</span><strong id="lowCount">—</strong></article></div><div class="panel"><div class="panel-head"><h2>Low-stock alert</h2><button onclick="showView('inventory')">Review inventory →</button></div><div id="lowTable"></div></div></section><section id="sales" class="view"><div class="section-head"><h2>Sales report</h2><button data-export="sales">Export CSV</button></div><div class="panel" id="salesTable"></div></section><section id="inventory" class="view"><div class="section-head"><h2>Inventory report</h2><button data-export="inventory">Export CSV</button></div><div class="panel" id="inventoryTable"></div></section><section id="suppliers" class="view"><div class="section-head"><h2>Supplier report</h2><button data-export="suppliers">Export CSV</button></div><div class="panel" id="suppliersTable"></div></section><button class="print" id="print">Print current report</button></main></div></body></html>
